<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratinjau Layar Masuk AVENGERS — E-Logbook</title>

<!--
  ALAT LIHAT, BUKAN BAGIAN APLIKASI.

  Berkas ini tidak menyalin satu baris pun dari layar masuk. Ia memuat
  ../index.html yang sungguhan di dalam bingkai, lalu memanggil showLogin() di
  dalamnya. Artinya yang Anda lihat di sini selalu layar yang sebenarnya —
  salinan akan melenceng diam-diam begitu aslinya disunting, dan pratinjau yang
  berbohong lebih buruk daripada tidak ada pratinjau.

  Kenapa perlu: layar masuk hanya tampil kalau tidak ada sesi. Yang sedang
  masuk — dan itu Anda, hampir selalu — tidak bisa melihatnya tanpa keluar
  dulu. Halaman ini menampilkannya tanpa menyentuh sesi sama sekali.

  Tema dan bahasa di sini TIDAK disimpan. Yang dipanggil terapkanTema() dan
  terapkanBahasa(), bukan gantiTema()/setBahasa() yang menulis ke localStorage.
  Melihat-lihat di sini tidak boleh diam-diam mengubah pilihan Anda yang
  sesungguhnya.

  Boleh dihapus kapan saja. Tidak ada berkas lain yang menunjuk ke sini.
-->

<style>
  :root{
    --alat-bg:#0d1117; --alat-panel:#161b22; --alat-line:#2b3440;
    --alat-teks:#dbe6ef; --alat-redup:#8496a5; --alat-aksen:#29b6f6;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--alat-bg); color:var(--alat-teks);
       font-family:'IBM Plex Sans',system-ui,sans-serif; min-height:100vh;
       display:flex; flex-direction:column;}

  .alat-kepala{display:flex; align-items:center; gap:18px; flex-wrap:wrap;
       padding:12px 18px; background:var(--alat-panel);
       border-bottom:1px solid var(--alat-line);}
  .alat-judul{font-size:13px; font-weight:600; letter-spacing:.04em;}
  .alat-judul span{display:block; font-size:10.5px; font-weight:400;
       color:var(--alat-redup); letter-spacing:.02em; margin-top:2px;}

  .alat-grup{display:flex; align-items:center; gap:6px;}
  .alat-grup > b{font-size:9.5px; font-weight:600; letter-spacing:.16em;
       text-transform:uppercase; color:var(--alat-redup); margin-right:2px;}
  .alat-grup button{background:transparent; border:1px solid var(--alat-line);
       color:var(--alat-redup); border-radius:6px; padding:6px 11px; cursor:pointer;
       font-family:'IBM Plex Mono',monospace; font-size:11px; transition:.15s;}
  .alat-grup button:hover{color:var(--alat-teks); border-color:var(--alat-redup);}
  .alat-grup button.aktif{color:#04222f; background:var(--alat-aksen);
       border-color:var(--alat-aksen); font-weight:600;}

  .alat-panggung{flex:1; display:grid; place-items:center; padding:18px; min-height:0;
       background:repeating-conic-gradient(#12181f 0% 25%, #0d1117 0% 50%) 50%/22px 22px;}
  .alat-bingkai{background:#000; border:1px solid var(--alat-line); border-radius:10px;
       overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.55);
       width:100%; height:100%; max-width:100%;}
  /* Sengaja tanpa transition. Alat pemeriksa harus berpindah seketika: lebar
     yang sedang beranimasi berarti setiap pengukuran di tengah jalan
     menghasilkan angka yang bukan angka mana pun, dan itu persis cara sebuah
     alat diagnostik mulai berbohong. */
  .alat-bingkai iframe{display:block; width:100%; height:100%; border:0;}

  .alat-kaki{padding:9px 18px; font-size:11px; color:var(--alat-redup);
       border-top:1px solid var(--alat-line); background:var(--alat-panel);}
  .alat-kaki b{color:var(--alat-teks); font-weight:600;}
</style>
</head>
<body>

<div class="alat-kepala">
  <div class="alat-judul">
    Pratinjau Layar Masuk
    <span>memuat ../index.html yang sungguhan · sesi Anda tidak disentuh</span>
  </div>

  <div class="alat-grup" id="grupTema">
    <b>Tema</b>
    <button data-tema="gelap" class="aktif">gelap</button>
    <button data-tema="terang">terang</button>
  </div>

  <div class="alat-grup" id="grupBahasa">
    <b>Bahasa</b>
    <button data-bahasa="id" class="aktif">ID</button>
    <button data-bahasa="en">EN</button>
    <button data-bahasa="es">ES</button>
  </div>

  <div class="alat-grup" id="grupLebar">
    <b>Layar</b>
    <button data-lebar="100%" class="aktif">penuh</button>
    <button data-lebar="1024px">tablet</button>
    <button data-lebar="375px">HP</button>
  </div>

  <div class="alat-grup">
    <button id="tombolSegar">↻ muat ulang</button>
  </div>
</div>

<div class="alat-panggung">
  <div class="alat-bingkai" id="bingkai">
    <iframe id="layar" src="../index.html" title="Layar masuk E-Logbook"></iframe>
  </div>
</div>

<div class="alat-kaki" id="kaki">Memuat layar…</div>

<script>
/* Keadaan pratinjau disimpan di sini saja — sengaja tidak di localStorage,
   supaya melihat-lihat tidak mengubah pilihan tema/bahasa Anda yang asli. */
const pratinjau = { tema:'gelap', bahasa:'id' };

const layar = document.getElementById('layar');
const kaki  = document.getElementById('kaki');

const jendela = () => layar.contentWindow;

function lapor(pesan){ kaki.innerHTML = pesan; }

/* Layar masuk hanya tampil kalau tidak ada sesi, dan mulai() di dalam bingkai
   berjalan asinkron — ia bisa memanggil hideLogin() SESUDAH kita memanggil
   showLogin(). Karena itu perintahnya diulang beberapa kali di detik-detik
   pertama, bukan sekali saat load. Menahannya dengan setInterval selamanya
   akan melawan aplikasinya sendiri; ini cuma menang di perlombaan awal. */
function paksaTampil(){
  try{
    const w = jendela();
    if(typeof w.showLogin !== 'function') return false;
    w.showLogin();
    terapkan();
    return true;
  }catch(e){ return false; }
}

/* Di dalam aplikasi, `bahasa` dan `userSaatIni` dideklarasikan dengan `let`.
   Deklarasi `let` di tingkat atas skrip klasik TIDAK menjadi properti window —
   jadi `w.bahasa` selalu undefined, dan menulisinya cuma membuat properti baru
   yang tidak dilihat siapa pun. Percobaan pertama berkas ini melakukan persis
   itu: tombol bahasanya menyala tapi layarnya tidak pernah berganti.

   Yang bisa dijangkau dari luar hanya `function` — showLogin, terapkanTema,
   setBahasa. Maka bahasa diganti lewat setBahasa(), dan karena fungsi itu
   memang menulis ke localStorage, nilainya disimpan lalu dikembalikan di
   sekelilingnya. Bingkai satu asal dengan halaman ini, jadi localStorage-nya
   sama persis dan pengembalian itu benar-benar mengembalikan. */
function terapkan(){
  const w = jendela();
  try{
    const d = w.document;
    if(d.documentElement.lang !== pratinjau.bahasa && typeof w.setBahasa === 'function'){
      const KUNCI = 'elogbook_bahasa';
      const sebelumnya = w.localStorage.getItem(KUNCI);
      w.setBahasa(pratinjau.bahasa);
      if(sebelumnya === null) w.localStorage.removeItem(KUNCI);
      else w.localStorage.setItem(KUNCI, sebelumnya);
    }
    /* Tema belakangan, bukan duluan: terapkanBahasa() di dalam aplikasi
       memanggil terapkanTema() dengan tema TERSIMPAN di akhir kerjanya, jadi
       tema yang disetel lebih dulu akan ditimpa balik oleh pergantian bahasa. */
    if(typeof w.terapkanTema === 'function') w.terapkanTema(pratinjau.tema);
  }catch(e){
    lapor('Tidak bisa mengatur bingkai: <b>' + (e.message || e) + '</b>');
  }
}

function kabarkan(){
  /* Sesinya dibaca dari LAYAR, bukan dari userSaatIni — variabel itu `let`
     dan tidak terlihat dari luar bingkai, jadi membacanya selalu menghasilkan
     "belum ada sesi" walaupun sesinya ada. Chip identitas hanya muncul kalau
     tampilkanUser() sudah jalan, dan itu jawaban yang bisa dipercaya. */
  let adaSesi = false;
  try{
    const w = jendela(), chip = w.document.getElementById('userChip');
    adaSesi = !!chip && w.getComputedStyle(chip).display !== 'none';
  }catch(e){}
  lapor(
    'Tema <b>' + pratinjau.tema + '</b> · bahasa <b>' + pratinjau.bahasa.toUpperCase() + '</b>. ' +
    (adaSesi
      ? 'Sesi Anda tetap hidup — layar masuk ini ditampilkan paksa hanya untuk dilihat, dan Anda <b>tidak</b> sedang keluar.'
      : 'Belum ada sesi, jadi layar ini memang yang tampil apa adanya.')
  );
}

layar.addEventListener('load', () => {
  lapor('Layar dimuat, menampilkan layar masuk…');
  /* Dicoba terus selama ±3 detik, lalu berhenti. Bukan sampai "berhasil"
     sekali: mulai() bisa memanggil hideLogin() beberapa saat SESUDAH panggilan
     kita yang pertama sudah berhasil, jadi berhenti di percobaan sukses
     pertama justru meninggalkan layar tersembunyi. */
  let sisa = 12;
  const coba = setInterval(() => {
    paksaTampil();
    if(--sisa <= 0){ clearInterval(coba); kabarkan(); }
  }, 250);
});

document.getElementById('grupTema').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  pratinjau.tema = b.dataset.tema;
  [...b.parentElement.querySelectorAll('button')].forEach(x => x.classList.toggle('aktif', x === b));
  terapkan(); kabarkan();
});

document.getElementById('grupBahasa').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  pratinjau.bahasa = b.dataset.bahasa;
  [...b.parentElement.querySelectorAll('button')].forEach(x => x.classList.toggle('aktif', x === b));
  terapkan(); kabarkan();
});

document.getElementById('grupLebar').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.getElementById('bingkai').style.maxWidth = b.dataset.lebar;
  [...b.parentElement.querySelectorAll('button')].forEach(x => x.classList.toggle('aktif', x === b));
});

document.getElementById('tombolSegar').addEventListener('click', () => {
  lapor('Memuat ulang…');
  layar.src = layar.src;
});
</script>

</body>
</html>
